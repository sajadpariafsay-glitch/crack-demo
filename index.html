<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stress ahead of a crack: σ_yy along x</title>
<style>
:root{--text-primary:#1d1f23;--text-secondary:#5b6170;--text-muted:#9aa1ad;--surface-1:#f5f6f8;--surface-2:#fff;--border-strong:#c4c8cf;--bg:#fff}
@media (prefers-color-scheme:dark){:root{--text-primary:#e7e9ee;--text-secondary:#a3a9b6;--text-muted:#6b7280;--surface-1:#1f2228;--surface-2:#16181c;--border-strong:#454a55;--bg:#16181c}}
html,body{margin:0;background:var(--bg);color:var(--text-primary);font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif}
html,body{height:100%;overflow:hidden}main{height:100vh;box-sizing:border-box;display:flex;flex-direction:column;padding:6px 12px}
svg{display:block;flex:1;min-height:0;width:100%;height:100%}
.t{font-size:14px;fill:var(--text-primary)}.ts{font-size:12px;fill:var(--text-secondary)}.th{font-size:14px;font-weight:500;fill:var(--text-primary)}
.rows{display:flex;gap:24px}.row{flex:1;display:flex;align-items:center;gap:10px;margin:4px 0;font-size:14px;color:var(--text-secondary)}
.row input{flex:1}.row b{min-width:48px;text-align:right;color:var(--text-primary);font-weight:500}
</style></head><body><main>
<svg viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid meet" role="img"><title>Plate with crack and stress ahead of the tip</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g id="g"></g></svg>
<div class="rows"><div class="row"><span>Position x/a</span><input type="range" id="xs" min="1" max="3" step="0.01" value="1.3"><b id="xo">1.30</b></div>
<div class="row"><span>Hole shape a/b</span><input type="range" id="ab" min="1" max="30" step="0.5" value="10"><b id="abo">10</b></div></div>
</main>
<script>
const g=document.getElementById('g');
function f(v,d){return Number(v).toFixed(d)}
function draw(){
  const xr=+document.getElementById('xs').value, ab=+document.getElementById('ab').value;
  document.getElementById('xo').textContent=f(xr,2); document.getElementById('abo').textContent=f(ab,1);
  const Kt=1+2*ab, c2=1-1/(Kt*Kt);
  const syy=x=>Math.min(x/Math.sqrt(Math.max(x*x-c2,1e-9)),Kt);
  const cx=230, cy=190, A=70, B=Math.max(A/ab,1.2), sc=A;
  let s='';
  s+=`<rect x="60" y="60" width="340" height="260" rx="4" fill="var(--surface-1)" stroke="var(--border-strong)" stroke-width="0.5"/>`;
  for(let i=0;i<5;i++){const x=100+i*65; s+=`<line x1="${x}" y1="56" x2="${x}" y2="24" stroke="var(--text-secondary)" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="${x}" y1="324" x2="${x}" y2="356" stroke="var(--text-secondary)" stroke-width="1.5" marker-end="url(#arrow)"/>`;}
  s+=`<text class="t" x="420" y="38">σ  applied far-field stress</text><text class="t" x="420" y="352">σ</text>`;
  s+=`<line x1="80" y1="${cy}" x2="390" y2="${cy}" stroke="var(--text-muted)" stroke-width="0.5" stroke-dasharray="4 4"/>`;
  s+=`<line x1="${cx}" y1="300" x2="${cx}" y2="80" stroke="var(--text-muted)" stroke-width="0.5" stroke-dasharray="4 4"/>`;
  s+=`<ellipse cx="${cx}" cy="${cy}" rx="${A}" ry="${B}" fill="var(--surface-2)" stroke="var(--text-primary)" stroke-width="1.2"/>`;
  s+=`<line x1="${cx}" y1="${cy+B+14}" x2="${cx+A}" y2="${cy+B+14}" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text class="ts" x="${cx+A/2}" y="${cy+B+30}" text-anchor="middle" style="fill:#7F77DD">a</text>`;
  s+=`<line x1="${cx-A-14}" y1="${cy}" x2="${cx-A-14}" y2="${cy-B}" stroke="#534AB7" stroke-width="1"/><text class="ts" x="${cx-A-22}" y="${cy-B/2-2}" text-anchor="end" style="fill:#7F77DD">b</text>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="2.5" fill="var(--text-primary)"/><text class="ts" x="${cx-6}" y="${cy-8}" text-anchor="end">0</text>`;
  s+=`<text class="ts" x="384" y="${cy-8}" text-anchor="end">x</text><text class="ts" x="${cx+8}" y="88">y</text>`;
  s+=`<circle cx="${cx+A}" cy="${cy}" r="9" fill="none" stroke="#E24B4A" stroke-width="1.2"/>`;
  const px=cx+xr*sc, v=syy(xr), L=Math.min(14+v*6,70);
  s+=`<line x1="${cx}" y1="${cy-34}" x2="${px}" y2="${cy-34}" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow)"/><text class="ts" x="${(cx+px)/2}" y="${cy-42}" text-anchor="middle" style="fill:#1D9E75">x</text>`;
  s+=`<rect x="${px-7}" y="${cy-7}" width="14" height="14" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>`;
  s+=`<line x1="${px}" y1="${cy-9}" x2="${px}" y2="${cy-9-L}" stroke="#D85A30" stroke-width="2.2" marker-end="url(#arrow)"/>`;
  s+=`<line x1="${px}" y1="${cy+9}" x2="${px}" y2="${cy+9+L}" stroke="#D85A30" stroke-width="2.2" marker-end="url(#arrow)"/>`;
  s+=`<text class="th" x="${px+12}" y="${cy-14-L/2}" style="fill:#D85A30">σ_yy</text>`;
  s+=`<text class="ts" x="420" y="120">Ellipse: half-length a, half-height b</text><text class="ts" x="420" y="140">Red circle: hole tip, x = a</text><text class="ts" x="420" y="160">Green square: small element at x</text><text class="ts" x="420" y="180">σ_yy: vertical stress on it,</text><text class="ts" x="420" y="196">same direction as the load</text>`;
  s+=`<text class="th" x="420" y="236">x/a = ${f(xr,2)}</text><text class="th" x="420" y="258" style="fill:#D85A30">σ_yy / σ = ${f(v,2)}</text><text class="ts" x="420" y="280">Tip value: σ_max/σ = 1 + 2a/b = ${f(Kt,1)}</text>`;
  const X0=720,Y0=50,W=440,H=270, ymax=Math.max(4,Math.min(Kt*1.08,65));
  const X=x=>X0+(x-1)/2*W, Y=y=>Y0+H-(y/ymax)*H;
  s+=`<rect x="${X0}" y="${Y0}" width="${W}" height="${H}" fill="none" stroke="var(--border-strong)" stroke-width="0.5"/>`;
  [1,1.5,2,2.5,3].forEach(t=>s+=`<text class="ts" x="${X(t)}" y="${Y0+H+16}" text-anchor="middle">${t}</text>`);
  [0,ymax/2,ymax].forEach(t=>s+=`<text class="ts" x="${X0-8}" y="${Y(t)+4}" text-anchor="end">${f(t,0)}</text>`);
  s+=`<text class="ts" x="${X0+W/2}" y="${Y0+H+36}" text-anchor="middle">x/a  (1 = hole tip, larger = farther ahead)</text><text class="ts" x="${X0}" y="${Y0-10}">σ_yy / σ</text>`;
  s+=`<line x1="${X0}" y1="${Y(1)}" x2="${X0+W}" y2="${Y(1)}" stroke="var(--text-muted)" stroke-width="0.5" stroke-dasharray="4 4"/><text class="ts" x="${X0+W-6}" y="${Y(1)-6}" text-anchor="end">far-field σ</text>`;
  let p='';for(let x=1;x<=3.0001;x+=0.004){p+=(p?'L':'M')+f(X(x),1)+' '+f(Y(syy(x)),1);}
  s+=`<path d="${p}" fill="none" stroke="#E24B4A" stroke-width="2"/>`;
  s+=`<line x1="${X(xr)}" y1="${Y0}" x2="${X(xr)}" y2="${Y0+H}" stroke="#1D9E75" stroke-width="0.8" stroke-dasharray="3 3"/><circle cx="${X(xr)}" cy="${Y(v)}" r="5" fill="#D85A30"/>`;
  g.innerHTML=s;
}
document.getElementById('xs').oninput=draw;document.getElementById('ab').oninput=draw;draw();

</script></body></html>
